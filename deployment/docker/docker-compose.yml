services:
  rust-node-alpha:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.rust
    environment:
      STRATUS_HOST: 0.0.0.0
      STRATUS_PORT: 8080
      STRATUS_NODE_ID: node-alpha
      STRATUS_NODE_ROLE: primary
      STRATUS_PUBLIC_ENDPOINT: http://rust-node-alpha:8080
      STRATUS_DB_PATH: /app/data/sql/node-alpha.db
      STRATUS_BOOTSTRAP_PEERS: http://rust-node-beta:8080
      STRATUS_SHARED_SECRET: development-shared-secret-alpha
    ports:
      - "8080:8080"
    volumes:
      - ../../data/sql:/app/data/sql
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  rust-node-beta:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.rust
    environment:
      STRATUS_HOST: 0.0.0.0
      STRATUS_PORT: 8080
      STRATUS_NODE_ID: node-beta
      STRATUS_NODE_ROLE: replica
      STRATUS_PUBLIC_ENDPOINT: http://rust-node-beta:8080
      STRATUS_DB_PATH: /app/data/sql/node-beta.db
      STRATUS_BOOTSTRAP_PEERS: http://rust-node-alpha:8080
      STRATUS_SHARED_SECRET: development-shared-secret-beta
    ports:
      - "8081:8080"
    volumes:
      - ../../data/sql:/app/data/sql
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  python-ops:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.python
    depends_on:
      rust-node-alpha:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src/python
    command: ["python", "-m", "app.main", "inspect-service", "--url", "http://rust-node-alpha:8080"]
